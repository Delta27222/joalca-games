<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Perrito · 6 estados</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFF8F0}
a{color:#C04B24}a:hover{color:#8F3517}
</style>
</helmet>
<div style="width: 1012px; height: 780px; box-sizing: border-box; padding: 32px; background: #FFF8F0; color: #2B1E16; font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 34px; line-height: 1.1; font-weight: 800">El perrito, error por error</h1>
<p style="margin: 0; font-size: 17px; color: #7A6A5E">Cabeza y cuerpo nunca se quitan. Desde el error 3 la expresión pasa a sorprendida.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{states}}" as="st" hint-placeholder-count="6">
<div style="height: 300px; border-radius: 20px; background: #E3EEF3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<dc-import name="Perrito" errors="{{st.e}}" size="{{210}}" hint-size="210px,210px"></dc-import>
<div style="font-size: 15px; font-weight: 800; color: #1F5C7A">{{st.e}} · {{st.label}}</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1012,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['Perrito completo', 'Sin cola', 'Sin oreja izquierda', 'Sin oreja derecha', 'Sin patas traseras', 'Sin patas delanteras · fin'];
    return { states: labels.map((label, e) => ({ e, label })) };
  }
}
</script>
</body>
</html>
