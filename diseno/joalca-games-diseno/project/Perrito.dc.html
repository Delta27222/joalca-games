<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Perrito</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{size}}px; height: {{size}}px; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 260 260" width="100%" height="100%" role="img" aria-label="{{label}}">
<g opacity="{{tailOp}}">
<path d="M180 198 C214 194 232 170 228 136" fill="none" stroke="#C98A52" stroke-width="16" stroke-linecap="round"></path>
</g>
<g opacity="{{backOp}}">
<ellipse cx="80" cy="210" rx="30" ry="24" fill="#D9A066"></ellipse>
<ellipse cx="180" cy="210" rx="30" ry="24" fill="#D9A066"></ellipse>
<ellipse cx="68" cy="231" rx="20" ry="10" fill="#FFF1DE"></ellipse>
<ellipse cx="192" cy="231" rx="20" ry="10" fill="#FFF1DE"></ellipse>
</g>
<ellipse cx="130" cy="180" rx="58" ry="60" fill="#E9B97F"></ellipse>
<ellipse cx="130" cy="194" rx="32" ry="38" fill="#FFF1DE"></ellipse>
<g opacity="{{frontOp}}">
<rect x="105" y="194" width="21" height="42" rx="10.5" fill="#E9B97F" stroke="#D9A066" stroke-width="2"></rect>
<rect x="134" y="194" width="21" height="42" rx="10.5" fill="#E9B97F" stroke="#D9A066" stroke-width="2"></rect>
<ellipse cx="115.5" cy="237" rx="15" ry="9" fill="#FFF1DE"></ellipse>
<ellipse cx="144.5" cy="237" rx="15" ry="9" fill="#FFF1DE"></ellipse>
</g>
<circle cx="130" cy="96" r="54" fill="#E9B97F"></circle>
<ellipse cx="151" cy="84" rx="17" ry="15" fill="#D9A066"></ellipse>
<ellipse cx="130" cy="118" rx="30" ry="22" fill="#FFF1DE"></ellipse>
<path d="M92 140 Q130 160 168 140" fill="none" stroke="#1F5C7A" stroke-width="8" stroke-linecap="round"></path>
<circle cx="130" cy="155" r="7" fill="#F7C548"></circle>
<g opacity="{{earLOp}}">
<path d="M86 58 C58 56 48 100 60 130 C68 146 92 136 94 112 C96 92 96 70 86 58 Z" fill="#B97A45"></path>
</g>
<g opacity="{{earROp}}">
<path d="M174 58 C202 56 212 100 200 130 C192 146 168 136 166 112 C164 92 164 70 174 58 Z" fill="#B97A45"></path>
</g>
<circle cx="110" cy="90" r="7" fill="#2B1E16"></circle>
<circle cx="150" cy="90" r="7" fill="#2B1E16"></circle>
<circle cx="112.5" cy="87.5" r="2.4" fill="#FFFFFF"></circle>
<circle cx="152.5" cy="87.5" r="2.4" fill="#FFFFFF"></circle>
<g opacity="{{surpOp}}">
<path d="M101 75 Q110 68 118 73" fill="none" stroke="#7A4A26" stroke-width="3" stroke-linecap="round"></path>
<path d="M142 73 Q150 68 159 75" fill="none" stroke="#7A4A26" stroke-width="3" stroke-linecap="round"></path>
<ellipse cx="130" cy="127" rx="5.5" ry="7" fill="#2B1E16"></ellipse>
</g>
<ellipse cx="130" cy="108" rx="10" ry="7" fill="#2B1E16"></ellipse>
<g opacity="{{happyOp}}">
<path d="M125 122 Q130 138 135 122 Z" fill="#F2784B"></path>
<path d="M118 118 Q124 126 130 118 Q136 126 142 118" fill="none" stroke="#2B1E16" stroke-width="3" stroke-linecap="round"></path>
</g>
<circle cx="98" cy="112" r="7" fill="#F2784B" opacity="0.3"></circle>
<circle cx="162" cy="112" r="7" fill="#F2784B" opacity="0.3"></circle>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"errors":{"editor":"int","min":0,"max":5,"default":0},"size":{"editor":"int","min":80,"max":600,"default":260},"$preview":{"width":260,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const e = Math.max(0, Math.min(5, Number(this.props.errors ?? 0)));
    const on = (n) => (e >= n ? 0 : 1);
    return {
      size: this.props.size ?? 260,
      tailOp: on(1),
      earLOp: on(2),
      earROp: on(3),
      backOp: on(4),
      frontOp: on(5),
      happyOp: e >= 3 ? 0 : 1,
      surpOp: e >= 3 ? 1 : 0,
      label: 'Perrito con ' + e + ' de 5 errores'
    };
  }
}
</script>
</body>
</html>
