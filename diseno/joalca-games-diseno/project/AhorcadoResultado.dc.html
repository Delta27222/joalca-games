<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Descubre la palabra · resultado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
:root{--bg:#FFF8F0;--surface:#FFFFFF;--text:#2B1E16;--text-muted:#7A6A5E;--primary:#F2784B;--accent-sopa:#2F6B4F;--accent-ahorcado:#1F5C7A;--success:#3BB273;--danger:#E04F5F;--border:#EADFD3}
body{margin:0;background:#FFF8F0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; position: relative; overflow: hidden; color: var(--text); font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; background: {{stage}}">
<sc-for list="{{confetti}}" as="c" hint-placeholder-count="0">
<div style="position: absolute; border-radius: 3px; left: {{c.x}}px; top: {{c.y}}px; width: {{c.w}}px; height: {{c.h}}px; background: {{c.color}}; transform: rotate({{c.r}}deg)"></div>
</sc-for>
<div style="position: relative; width: 980px; box-sizing: border-box; padding: 40px 44px; border-radius: 32px; background: var(--surface); box-shadow: 0 24px 60px rgba(0,0,0,0.18); display: flex; gap: 36px; align-items: stretch">
<div style="width: 220px; flex: none; border-radius: 20px; background: #E3EEF3; display: flex; align-items: center; justify-content: center">
<dc-import name="Perrito" errors="{{dogErrors}}" size="{{200}}" hint-size="200px,200px"></dc-import>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 14px; font-weight: 800; letter-spacing: 0.14em; color: var(--accent-ahorcado)">DIAMOND CARE · SENSITIVE SKIN</div>
<h1 style="margin: 0; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 60px; line-height: 1; font-weight: 800; color: {{titleColor}}">{{title}}</h1>
<sc-if value="{{won}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 30px; font-weight: 700; color: #1F5C7A">HIDROLIZADO DE SALMÓN</p>
<div style="display: flex; gap: 12px">
<div style="flex: 1; border-radius: 16px; padding: 12px 18px; background: #FFF1E9">
<div style="font-size: 15px; font-weight: 700; color: #7A6A5E">Quedaste en el puesto</div>
<div style="font-family: 'Baloo 2', system-ui, sans-serif; font-size: 40px; font-weight: 800; line-height: 1.1">#4</div>
</div>
<div style="flex: 1; border-radius: 16px; padding: 12px 18px; background: #FFF1E9">
<div style="font-size: 15px; font-weight: 700; color: #7A6A5E">Tu tiempo</div>
<div style="font-family: 'Baloo 2', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 40px; font-weight: 800; line-height: 1.1">00:38</div>
</div>
</div>
</sc-if>
<sc-if value="{{lost}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 22px; font-weight: 700">La respuesta era:</p>
<p style="margin: 0; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 34px; line-height: 1.1; font-weight: 700; color: #1F5C7A">HIDROLIZADO DE SALMÓN</p>
</sc-if>
<div style="display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 14px 18px; background: #E3EEF3; color: #173F55; font-size: 20px; font-weight: 800">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12v9H4v-9"></path><path d="M2 7h20v5H2z"></path><path d="M12 21V7"></path><path d="M12 7H8a2.5 2.5 0 1 1 0-5c3 0 4 5 4 5Z"></path><path d="M12 7h4a2.5 2.5 0 1 0 0-5c-3 0-4 5-4 5Z"></path></svg>
<span>Ya estás participando en el sorteo</span>
</div>
<div style="margin-top: auto; display: flex; gap: 14px; padding-top: 8px">
<a href="Ranking.dc.html" style="flex: 1; height: 68px; border-radius: 14px; background: #FFFFFF; color: #2B1E16; box-shadow: inset 0 0 0 2px #2B1E16; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 24px; font-weight: 700">Ver ranking</a>
<a href="Registro.dc.html" style="flex: 1; height: 68px; border-radius: 14px; background: #F2784B; color: #2B1E16; box-shadow: 0 4px 0 #C9532A; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 24px; font-weight: 700">Jugar de nuevo</a>
</div>
</div>
<div style="width: 216px; flex: none; border-radius: 20px; background: #FFF8F0; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; justify-content: center">
<div aria-label="Código QR personal" style="width: 180px; height: 180px; box-sizing: border-box; padding: 9px; background: #FFFFFF; border-radius: 12px; display: grid; grid-template-columns: repeat(21, minmax(0, 1fr))">
<sc-for list="{{qr}}" as="q" hint-placeholder-count="441">
<div style="aspect-ratio: 1; background: {{q}}"></div>
</sc-for>
</div>
<div style="font-size: 16px; font-weight: 700; text-align: center; line-height: 1.35">Escanea para ver tu posición en tu celular</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"resultado":{"editor":"enum","options":["gana","pierde por tiempo","pierde por errores"],"default":"pierde por errores"},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const res = this.props.resultado ?? 'pierde por errores';
    const won = res === 'gana';
    let s = 9001;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const finder = (r, c, R, C) => {
      const y = r - R, x = c - C;
      if (y < 0 || x < 0 || y > 6 || x > 6) return null;
      return (y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4));
    };
    const qr = [];
    for (let r = 0; r < 21; r++) for (let c = 0; c < 21; c++) {
      let f = finder(r, c, 0, 0);
      if (f === null) f = finder(r, c, 0, 14);
      if (f === null) f = finder(r, c, 14, 0);
      const inZone = (r < 8 && c < 8) || (r < 8 && c > 12) || (r > 12 && c < 8);
      const on = f !== null ? f : (inZone ? false : rnd() > 0.52);
      qr.push(on ? '#2B1E16' : 'transparent');
    }
    const palette = ['#F2784B', '#F7C548', '#FFFFFF', '#3BB273', '#F5D0E3'];
    const confetti = [];
    for (let i = 0; i < 28; i++) {
      confetti.push({ x: Math.round(rnd() * 1160), y: Math.round(rnd() * 800), w: 10 + Math.round(rnd() * 8), h: 18 + Math.round(rnd() * 10), r: Math.round(rnd() * 180), color: palette[i % palette.length] });
    }
    return {
      won,
      lost: !won,
      title: won ? '¡LO LOGRASTE!' : (res === 'pierde por tiempo' ? '¡TIEMPO!' : '¡Sin intentos!'),
      titleColor: won ? '#1F5C7A' : '#B3303F',
      stage: won ? '#1F5C7A' : '#5B4A3F',
      dogErrors: won ? 0 : (res === 'pierde por tiempo' ? 3 : 5),
      confetti: won ? confetti : [],
      qr
    };
  }
}
</script>
</body>
</html>
