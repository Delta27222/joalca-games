<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Instrucciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
:root{--bg:#FFF8F0;--surface:#FFFFFF;--text:#2B1E16;--text-muted:#7A6A5E;--primary:#F2784B;--accent-sopa:#2F6B4F;--accent-ahorcado:#1F5C7A;--success:#3BB273;--danger:#E04F5F;--border:#EADFD3}
body{margin:0;background:#FFF8F0}
a{color:#C04B24}a:hover{color:#8F3517}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 92px; flex: none; box-sizing: border-box; padding: 0 32px; color: #FFFFFF; display: flex; align-items: center; gap: 24px; background: {{accent}}">
<div style="width: 132px; height: 56px; flex: none; border: 2px dashed rgba(255,255,255,0.6); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; letter-spacing: 0.1em">LOGO</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 800; letter-spacing: 0.14em">{{brand}}</div>
<div style="font-family: 'Baloo 2', system-ui, sans-serif; font-size: 32px; line-height: 1.1; font-weight: 700">{{game}}</div>
</div>
</header>
<main style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 32px">
<div style="width: 860px; box-sizing: border-box; padding: 48px 56px; border-radius: 28px; background: var(--surface); box-shadow: 0 2px 0 #EADFD3, 0 18px 40px rgba(43,30,22,0.08); display: flex; gap: 48px; align-items: center">
<div style="width: 260px; height: 260px; flex: none; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: {{chipBg}}">
<sc-if value="{{sopa}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px; align-items: center">
<div style="display: flex; gap: 4px; padding: 6px; border-radius: 14px; background: #F7E3A8">
<div style="width: 38px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 24px; font-weight: 700">O</div>
<div style="width: 38px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 24px; font-weight: 700">M</div>
<div style="width: 38px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 24px; font-weight: 700">E</div>
<div style="width: 38px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 24px; font-weight: 700">G</div>
<div style="width: 38px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 24px; font-weight: 700">A</div>
</div>
<svg width="200" height="44" viewBox="0 0 200 44" fill="none" stroke="#2F6B4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 22h150"></path><path d="M160 12l12 10-12 10"></path><circle cx="20" cy="22" r="8" fill="#2F6B4F"></circle></svg>
<div style="font-size: 15px; font-weight: 800; color: #2F6B4F">Arrastra el dedo</div>
</div>
</sc-if>
<sc-if value="{{ahorcado}}" hint-placeholder-val="{{false}}">
<dc-import name="Perrito" errors="{{0}}" size="{{220}}" hint-size="220px,220px"></dc-import>
</sc-if>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 44px; line-height: 1.05; font-weight: 800">¿Cómo se juega?</h1>
<p style="margin: 0; font-size: 22px; line-height: 1.45">{{rule}}</p>
<div style="align-self: flex-start; height: 44px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; background: {{chipBg}}; color: {{accent}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M10 2h4"></path></svg>
<span>Tienes {{dur}}</span>
</div>
<a href="CuentaRegresiva.dc.html" style="margin-top: 8px; height: 76px; border-radius: 16px; background: #F2784B; color: #2B1E16; box-shadow: 0 5px 0 #C9532A; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 32px; font-weight: 800; text-decoration: none">¡Comenzar!</a>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"juego":{"editor":"enum","options":["sopa","ahorcado"],"default":"sopa"},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const sopa = (this.props.juego ?? 'sopa') === 'sopa';
    return {
      sopa,
      ahorcado: !sopa,
      accent: sopa ? '#2F6B4F' : '#1F5C7A',
      chipBg: sopa ? '#E6F0EA' : '#E3EEF3',
      brand: sopa ? 'TASTE OF THE WILD' : 'DIAMOND CARE · SENSITIVE SKIN',
      game: sopa ? 'Encuentra los beneficios' : 'Descubre la palabra',
      dur: sopa ? '2:00' : '1:00',
      rule: sopa
        ? 'Encuentra los 10 beneficios escondidos en el tablero. Arrastra el dedo de la primera a la última letra, o toca la primera y luego la última.'
        : 'Descubre la frase tocando letras en el teclado. Tienes 5 intentos: cada error le quita una parte al perrito.'
    };
  }
}
</script>
</body>
</html>
